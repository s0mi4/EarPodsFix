# Сборка релиза: при пуше тега вида v1.2.3 собирает EarPodsFix (Apple Silicon + Intel)
# и прикладывает .dmg и .zip к GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          chmod +x release.sh
          ./release.sh "$VERSION" "$GITHUB_RUN_NUMBER"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EarPodsFix
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
